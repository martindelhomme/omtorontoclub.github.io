<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galerie – OM Toronto Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:#0a1628;color:#fff;}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:52px;background:rgba(10,22,40,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,168,76,0.2);}
    .topbar-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .topbar-logo img{width:32px;height:32px;border-radius:50%;object-fit:contain;}
    .topbar-logo span{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:#fff;letter-spacing:0.05em;}
    .topbar-logo span em{color:#c9a84c;font-style:normal;}
    nav{display:flex;align-items:center;gap:0.25rem;}
    .nav-link{color:rgba(255,255,255,0.55);font-size:0.8rem;font-weight:500;text-decoration:none;padding:0.35rem 0.65rem;border-radius:6px;transition:color 0.15s,background 0.15s;white-space:nowrap;}
    .nav-link:hover{color:#fff;background:rgba(255,255,255,0.06);}
    .nav-link.active{color:#c9a84c;}
    .lang-bar{display:flex;gap:3px;margin-left:0.75rem;padding-left:0.75rem;border-left:1px solid rgba(255,255,255,0.1);}
    .lang-btn{background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 3px;border-radius:4px;opacity:0.45;transition:opacity 0.15s,transform 0.15s;}
    .lang-btn:hover{opacity:0.85;transform:scale(1.15);}
    .lang-btn.active{opacity:1;transform:scale(1.15);}
    .page-body{padding-top:52px;}
    .page-header{background:linear-gradient(160deg,#0d1f3c 0%,#1a3260 50%,#0d1f3c 100%);padding:2.5rem 1.5rem 2rem;text-align:center;border-bottom:3px solid #c9a84c;}
    .page-header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,6vw,3rem);letter-spacing:0.08em;color:#fff;}
    .page-header h1 span{color:#c9a84c;}
    .page-header p{color:rgba(255,255,255,0.5);font-size:0.8rem;text-transform:uppercase;letter-spacing:0.1em;margin-top:0.4rem;}
    .section{padding:2rem 1.5rem;background:#091424;}
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;max-width:1000px;margin:0 auto;}
    .photo-item{border-radius:12px;overflow:hidden;background:#0d1f3c;border:1px solid rgba(201,168,76,0.15);cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;}
    .photo-item:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,0.5);}
    .photo-item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
    .photo-caption{padding:0.6rem 0.85rem;}
    .photo-caption .legende{font-size:0.85rem;font-weight:500;color:#fff;}
    .photo-caption .meta{font-size:0.72rem;color:rgba(255,255,255,0.4);margin-top:2px;}
    /* LIGHTBOX */
    .lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.92);align-items:center;justify-content:center;flex-direction:column;}
    .lightbox.open{display:flex;}
    .lightbox img{max-width:90vw;max-height:80vh;border-radius:8px;object-fit:contain;}
    .lightbox-caption{margin-top:1rem;text-align:center;}
    .lightbox-caption .legende{font-size:1rem;font-weight:500;color:#fff;}
    .lightbox-caption .meta{font-size:0.8rem;color:rgba(255,255,255,0.4);margin-top:4px;}
    .lightbox-close{position:absolute;top:1.5rem;right:1.5rem;background:none;border:none;color:#fff;font-size:1.8rem;cursor:pointer;opacity:0.6;transition:opacity 0.15s;}
    .lightbox-close:hover{opacity:1;}
    .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:1.5rem;padding:0.75rem 1rem;cursor:pointer;border-radius:8px;transition:background 0.15s;}
    .lightbox-nav:hover{background:rgba(255,255,255,0.2);}
    .lightbox-prev{left:1rem;}
    .lightbox-next{right:1rem;}
    #loading{text-align:center;padding:2rem;color:rgba(255,255,255,0.4);}
    .footer{background:#060f1c;padding:1.25rem;text-align:center;border-top:1px solid rgba(255,255,255,0.06);}
    .footer p{font-size:0.72rem;color:rgba(255,255,255,0.25);letter-spacing:0.04em;}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="topbar-logo" href="index.html"><img src="logo.png" alt="logo"/><span>OM <em>Toronto</em></span></a>
    <nav>
      <a class="nav-link" href="index.html" data-fr="Accueil" data-en="Home">Accueil</a>
      <a class="nav-link" href="calendrier.html" data-fr="Calendrier" data-en="Schedule">Calendrier</a>
      <a class="nav-link active" href="galerie.html" data-fr="Galerie" data-en="Gallery">Galerie</a>
      <a class="nav-link" href="goodies.html" data-fr="Goodies" data-en="Goodies">Goodies</a>
      <div class="lang-bar">
        <button class="lang-btn active" onclick="setLang('fr',event)">🇫🇷</button>
        <button class="lang-btn" onclick="setLang('en',event)">🇬🇧</button>
      </div>
    </nav>
  </div>
  <div class="page-body">
    <div class="page-header">
      <h1 data-fr="Notre <span>Galerie</span>" data-en="Our <span>Gallery</span>">Notre <span>Galerie</span></h1>
      <p data-fr="Photos de nos rassemblements et matchs" data-en="Photos from our gatherings and matches">Photos de nos rassemblements et matchs</p>
    </div>
    <div class="section">
      <div id="loading">Chargement des photos…</div>
      <div class="photo-grid" id="grid"></div>
    </div>
    <footer class="footer">
      <p>© 2023 OM Toronto Club · <span data-fr="Site non officiel" data-en="Unofficial website">Site non officiel</span> · Not affiliated with Olympique de Marseille</p>
    </footer>
  </div>
  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">‹</button>
    <img id="lb-img" src="" alt=""/>
    <div class="lightbox-caption"><div class="legende" id="lb-legend"></div><div class="meta" id="lb-meta"></div></div>
    <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">›</button>
  </div>
  <script>
    function setLang(lang,event){document.querySelectorAll("[data-fr]").forEach(el=>{if(el.getAttribute("data-"+lang))el.innerHTML=el.getAttribute("data-"+lang)});document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));event.currentTarget.classList.add("active");document.documentElement.lang=lang;localStorage.setItem("lang",lang);}
    let photos=[]; let currentIdx=0;
    function openLightbox(i){currentIdx=i;const p=photos[i];document.getElementById("lb-img").src="photos/"+p.fichier;document.getElementById("lb-legend").textContent=p.legende;document.getElementById("lb-meta").textContent=(p.match?p.match+" · ":"")+p.date;document.getElementById("lightbox").classList.add("open");}
    function closeLightbox(){document.getElementById("lightbox").classList.remove("open");}
    function navLightbox(dir){currentIdx=(currentIdx+dir+photos.length)%photos.length;openLightbox(currentIdx);}
    document.getElementById("lightbox").addEventListener("click",function(e){if(e.target===this)closeLightbox();});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox();if(e.key==="ArrowRight")navLightbox(1);if(e.key==="ArrowLeft")navLightbox(-1);});
    fetch("photos.json").then(r=>r.json()).then(data=>{
      photos=data;
      document.getElementById("loading").style.display="none";
      const grid=document.getElementById("grid");
      data.forEach((p,i)=>{
        const div=document.createElement("div");
        div.className="photo-item";
        div.onclick=()=>openLightbox(i);
        div.innerHTML=`<img src="photos/${p.fichier}" alt="${p.legende}" loading="lazy"/><div class="photo-caption"><div class="legende">${p.legende}</div><div class="meta">${p.match?p.match+" · ":""}${p.date}</div></div>`;
        grid.appendChild(div);
      });
    }).catch(()=>{document.getElementById("loading").textContent="Aucune photo disponible pour le moment.";});
    (function(){const l=localStorage.getItem("lang")||"fr";if(l!=="fr"){document.querySelectorAll("[data-fr]").forEach(el=>{if(el.getAttribute("data-"+l))el.innerHTML=el.getAttribute("data-"+l)});document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));const btns=document.querySelectorAll(".lang-btn");if(l==="en"&&btns[1])btns[1].classList.add("active");document.documentElement.lang=l;}})();
  </script>
</body>
</html>
