<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galerie – OM Toronto Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:#0a1628;color:#fff;}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:52px;background:rgba(10,22,40,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,168,76,0.2);}
    .topbar-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .topbar-logo img{width:32px;height:32px;border-radius:50%;object-fit:contain;}
    .topbar-logo span{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:#fff;letter-spacing:0.05em;}
    .topbar-logo span em{color:#c9a84c;font-style:normal;} @media(max-width:600px){.topbar-logo{display:none!important;}}
    nav{display:flex;align-items:center;gap:0.25rem;}
    .nav-link{color:rgba(255,255,255,0.55);font-size:0.8rem;font-weight:500;text-decoration:none;padding:0.35rem 0.65rem;border-radius:6px;transition:color 0.15s,background 0.15s;white-space:nowrap;}
    .nav-link:hover{color:#fff;background:rgba(255,255,255,0.06);}
    .nav-link.active{color:#c9a84c;}
    .lang-bar{display:flex;gap:3px;margin-left:0.75rem;padding-left:0.75rem;border-left:1px solid rgba(255,255,255,0.1);}
    .lang-btn{background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 3px;border-radius:4px;opacity:0.45;transition:opacity 0.15s,transform 0.15s;}
    .lang-btn:hover{opacity:0.85;transform:scale(1.15);}
    .lang-btn.active{opacity:1;transform:scale(1.15);}
    .page-body{padding-top:52px;}
    .page-header{background:linear-gradient(160deg,#0d1f3c 0%,#1a3260 50%,#0d1f3c 100%);padding:2.5rem 1.5rem 2rem;text-align:center;border-bottom:3px solid #c9a84c;}
    .page-header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,6vw,3rem);letter-spacing:0.08em;color:#fff;}
    .page-header h1 span{color:#c9a84c;}
    .page-header p{color:rgba(255,255,255,0.5);font-size:0.8rem;text-transform:uppercase;letter-spacing:0.1em;margin-top:0.4rem;}

    /* CAROUSEL */
    .carousel-section{background:#091424;padding:2.5rem 1.5rem;}
    .carousel-wrap{position:relative;max-width:800px;margin:0 auto;}
    .carousel-track{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#0d1f3c;border:1px solid rgba(201,168,76,0.2);}
    .carousel-slide{display:none;position:relative;}
    .carousel-slide.active{display:block;}
    .carousel-slide img{width:100%;max-height:500px;object-fit:cover;display:block;}
    .carousel-caption{position:absolute;bottom:0;left:0;right:0;padding:1rem 1.25rem;background:linear-gradient(transparent,rgba(6,15,28,0.95));text-align:left;}
    .carousel-caption .legende{font-size:0.95rem;font-weight:600;color:#fff;}
    .carousel-caption .meta{font-size:0.75rem;color:rgba(255,255,255,0.5);margin-top:3px;}

    /* ARROWS */
    .carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,22,40,0.7);border:1px solid rgba(201,168,76,0.3);color:#fff;font-size:1.4rem;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s,border-color 0.15s;z-index:10;}
    .carousel-btn:hover{background:rgba(201,168,76,0.2);border-color:#c9a84c;}
    .carousel-prev{left:-20px;}
    .carousel-next{right:-20px;}
    @media(max-width:600px){.carousel-prev{left:6px;}.carousel-next{right:6px;}}

    /* DOTS */
    .carousel-dots{display:flex;justify-content:center;gap:6px;margin-top:1rem;}
    .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);border:none;cursor:pointer;padding:0;transition:background 0.2s,transform 0.2s;}
    .dot.active{background:#c9a84c;transform:scale(1.3);}

    /* COUNTER */
    .carousel-counter{text-align:center;margin-top:0.6rem;font-size:0.75rem;color:rgba(255,255,255,0.35);letter-spacing:0.05em;}

    /* LOADING */
    #loading{text-align:center;padding:3rem;color:rgba(255,255,255,0.4);}

    .footer{background:#060f1c;padding:1.25rem;text-align:center;border-top:1px solid rgba(255,255,255,0.06);}
    .footer p{font-size:0.72rem;color:rgba(255,255,255,0.25);letter-spacing:0.04em;}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="topbar-logo" href="index.html"><img src="logo.png" alt="logo"/><span>OM <em>Toronto</em></span></a>
    <nav>
      <a class="nav-link" href="index.html" data-fr="Accueil" data-en="Home">Accueil</a>
      <a class="nav-link" href="calendrier.html" data-fr="Calendrier" data-en="Schedule">Calendrier</a>
      <a class="nav-link active" href="galerie.html" data-fr="Galerie" data-en="Gallery">Galerie</a>
      <a class="nav-link" href="goodies.html" data-fr="Goodies" data-en="Goodies">Goodies</a>
      <div class="lang-bar">
        <button class="lang-btn active" onclick="setLang('fr',event)">🇫🇷</button>
        <button class="lang-btn" onclick="setLang('en',event)">🇬🇧</button>
      </div>
    </nav>
  </div>

  <div class="page-body">
    <div class="page-header">
      <h1 data-fr="Notre <span>Galerie</span>" data-en="Our <span>Gallery</span>">Notre <span>Galerie</span></h1>
      <p data-fr="Nos meilleurs moments ensemble" data-en="Our best moments together">Nos meilleurs moments ensemble</p>
    </div>

    <div class="carousel-section">
      <div id="loading">Chargement des photos…</div>
      <div class="carousel-wrap" id="carousel-wrap" style="display:none;">
        <div class="carousel-track" id="track"></div>
        <button class="carousel-btn carousel-prev" onclick="move(-1)">&#8249;</button>
        <button class="carousel-btn carousel-next" onclick="move(1)">&#8250;</button>
      </div>
      <div class="carousel-dots" id="dots"></div>
      <div class="carousel-counter" id="counter"></div>
      <div style="text-align:center;margin-top:2rem;">
        <a href="https://www.instagram.com/omtorontoclub?igsh=MW5ybjhzMWZkODU0OA==" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:10px;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:0.95rem;padding:0.8rem 1.75rem;border-radius:50px;text-decoration:none;box-shadow:0 4px 20px rgba(225,48,108,0.35);transition:transform 0.15s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
          <svg viewBox="0 0 24 24" fill="white" style="width:20px;height:20px;flex-shrink:0;"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          <span data-fr="Plus de photos sur notre Instagram" data-en="More photos on our Instagram">Plus de photos sur notre Instagram</span>
        </a>
      </div>
    </div>

    <footer class="footer">
      <p>© 2023 OM Toronto Club · <span data-fr="Site non officiel" data-en="Unofficial website">Site non officiel</span> · Not affiliated with Olympique de Marseille</p>
    </footer>
  </div>

  <script>
    function setLang(lang,event){document.querySelectorAll("[data-fr]").forEach(el=>{if(el.getAttribute("data-"+lang))el.innerHTML=el.getAttribute("data-"+lang)});document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));event.currentTarget.classList.add("active");document.documentElement.lang=lang;localStorage.setItem("lang",lang);}
    (function(){const l=localStorage.getItem("lang")||"fr";if(l!=="fr"){document.querySelectorAll("[data-fr]").forEach(el=>{if(el.getAttribute("data-"+l))el.innerHTML=el.getAttribute("data-"+l)});document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));const btns=document.querySelectorAll(".lang-btn");if(l==="en"&&btns[1])btns[1].classList.add("active");document.documentElement.lang=l;}})();

    let current=0, total=0, timer=null;

    function goTo(i){
      document.querySelectorAll(".carousel-slide").forEach((s,idx)=>{s.classList.toggle("active",idx===i);});
      document.querySelectorAll(".dot").forEach((d,idx)=>{d.classList.toggle("active",idx===i);});
      current=i;
      document.getElementById("counter").textContent=(i+1)+" / "+total;
    }

    function move(dir){
      clearInterval(timer);
      goTo((current+dir+total)%total);
      startAuto();
    }

    function startAuto(){
      timer=setInterval(()=>goTo((current+1)%total),4000);
    }

    // Swipe support
    let touchStartX=0;
    document.addEventListener("touchstart",e=>touchStartX=e.touches[0].clientX,{passive:true});
    document.addEventListener("touchend",e=>{
      const dx=e.changedTouches[0].clientX-touchStartX;
      if(Math.abs(dx)>40)move(dx<0?1:-1);
    },{passive:true});

    fetch("photos.json").then(r=>r.json()).then(photos=>{
      total=photos.length;
      document.getElementById("loading").style.display="none";
      document.getElementById("carousel-wrap").style.display="block";
      const track=document.getElementById("track");
      const dots=document.getElementById("dots");
      photos.forEach((p,i)=>{
        const slide=document.createElement("div");
        slide.className="carousel-slide"+(i===0?" active":"");
        slide.innerHTML=`<img src="${p.fichier}" alt="${p.legende}" loading="lazy"/><div class="carousel-caption"><div class="legende">${p.legende}</div><div class="meta">${p.match?p.match+" · ":""}${p.date}</div></div>`;
        track.appendChild(slide);
        const dot=document.createElement("button");
        dot.className="dot"+(i===0?" active":"");
        dot.onclick=()=>{clearInterval(timer);goTo(i);startAuto();};
        dots.appendChild(dot);
      });
      document.getElementById("counter").textContent="1 / "+total;
      startAuto();
    }).catch(()=>{document.getElementById("loading").textContent="Aucune photo disponible pour le moment.";});
  </script>
</body>
</html>
