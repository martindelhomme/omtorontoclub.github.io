<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OM Toronto Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0a1628; color: #fff; }

    .hero {
      background: linear-gradient(160deg, #0d1f3c 0%, #1a3260 50%, #0d1f3c 100%);
      padding: 3rem 1.5rem 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid #c9a84c;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.12) 0%, transparent 65%);
      pointer-events: none;
    }
    .logo-wrap {
      width: 140px; height: 140px;
      margin: 0 auto 1.25rem;
      filter: drop-shadow(0 4px 24px rgba(201,168,76,0.35));
      position: relative; z-index: 1;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; display: block; }
    .hero h1 {
      font-family: 'Bebas Neue', 'Impact', sans-serif;
      font-size: clamp(2.6rem, 7vw, 4rem);
      letter-spacing: 0.05em; color: #fff;
      line-height: 1; margin-bottom: 0.4rem;
      position: relative; z-index: 1;
    }
    .hero h1 span { color: #c9a84c; }
    .hero p {
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
      position: relative; z-index: 1;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem; letter-spacing: 0.1em;
      color: #c9a84c; text-align: center;
      margin-bottom: 0.5rem; text-transform: uppercase;
    }
    .divider { width: 40px; height: 2px; background: #c9a84c; margin: 0 auto 1.5rem; border-radius: 1px; }

    .whatsapp-section {
      background: #0d1f3c; padding: 2.5rem 1.5rem; text-align: center;
      border-top: 1px solid rgba(201,168,76,0.2);
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
    .whatsapp-section p { color: rgba(255,255,255,0.65); font-size: 0.9rem; max-width: 360px; margin: 0 auto 1.5rem; line-height: 1.6; }
    .btn-whatsapp {
      display: inline-flex; align-items: center; gap: 10px;
      background: #25D366; color: #fff;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1rem;
      padding: 0.85rem 2rem; border-radius: 50px; border: none;
      cursor: pointer; text-decoration: none; letter-spacing: 0.02em;
      box-shadow: 0 4px 20px rgba(37,211,102,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-whatsapp:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(37,211,102,0.4); }
    .btn-whatsapp svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }

    .social-section { background: #091424; padding: 2.5rem 1.5rem; }
    .social-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem; max-width: 600px; margin: 0 auto;
    }
    .social-card {
      background: #0d1f3c; border: 1px solid rgba(201,168,76,0.2);
      border-radius: 16px; padding: 1.25rem 1rem; text-align: center;
      text-decoration: none; color: #fff;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
    }
    .social-card:hover { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(0,0,0,0.4); }
    .social-card.fb:hover { border-color: #1877F2; }
    .social-card.ig:hover { border-color: #E1306C; }
    .social-card.tw:hover { border-color: #fff; }
    .social-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .social-icon svg { width: 24px; height: 24px; }
    .social-icon.fb { background: #1877F2; }
    .social-icon.ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
    .social-icon.tw { background: #111; border: 1px solid rgba(255,255,255,0.15); }
    .social-name { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.08em; }
    .social-handle { font-size: 0.9rem; font-weight: 500; color: #fff; }

    .about-section { background: #0d1f3c; padding: 2.5rem 1.5rem; border-top: 1px solid rgba(201,168,76,0.2); }
    .about-inner { max-width: 560px; margin: 0 auto; text-align: center; }
    .about-inner p { color: rgba(255,255,255,0.7); font-size: 0.92rem; line-height: 1.75; margin-bottom: 1rem; }
    .flag-row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 1.4rem; }
    .contact-row { display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .contact-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: #c9a84c; font-size: 0.9rem; font-weight: 500;
      text-decoration: none; border-bottom: 1px solid rgba(201,168,76,0.4);
      padding-bottom: 2px; transition: border-color 0.15s;
    }
    .contact-link:hover { border-color: #c9a84c; }
    .contact-link svg { width: 16px; height: 16px; flex-shrink: 0; }

    .footer { background: #060f1c; padding: 1.25rem; text-align: center; border-top: 1px solid rgba(255,255,255,0.06); }
    .footer p { font-size: 0.72rem; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
  </style>
</head>
