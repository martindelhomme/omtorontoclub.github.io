<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agenda – OM Toronto Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:#0a1628;color:#fff;}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:52px;background:rgba(10,22,40,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,168,76,0.2);}
    .topbar-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .topbar-logo img{width:32px;height:32px;border-radius:50%;object-fit:contain;}
    .topbar-logo span{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:#fff;letter-spacing:0.05em;}
    .topbar-logo span em{color:#c9a84c;font-style:normal;} @media(max-width:600px){.topbar-logo{display:none!important;}}
    nav{display:flex;align-items:center;gap:0.25rem;}
    .nav-link{color:rgba(255,255,255,0.55);font-size:0.8rem;font-weight:500;text-decoration:none;padding:0.35rem 0.65rem;border-radius:6px;transition:color 0.15s,background 0.15s;white-space:nowrap;}
    .nav-link:hover{color:#fff;background:rgba(255,255,255,0.06);}
    .nav-link.active{color:#c9a84c;}
    .lang-bar{display:flex;gap:3px;margin-left:0.75rem;padding-left:0.75rem;border-left:1px solid rgba(255,255,255,0.1);}
    .lang-btn{background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 3px;border-radius:4px;opacity:0.45;transition:opacity 0.15s,transform 0.15s;}
    .lang-btn:hover{opacity:0.85;transform:scale(1.15);}
    .lang-btn.active{opacity:1;transform:scale(1.15);}
    .page-body{padding-top:52px;}
    .page-header{background:linear-gradient(160deg,#0d1f3c 0%,#1a3260 50%,#0d1f3c 100%);padding:2.5rem 1.5rem 2rem;text-align:center;border-bottom:3px solid #c9a84c;}
    .page-header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,6vw,3rem);letter-spacing:0.08em;color:#fff;}
    .page-header h1 span{color:#c9a84c;}
    .page-header p{color:rgba(255,255,255,0.5);font-size:0.8rem;text-transform:uppercase;letter-spacing:0.1em;margin-top:0.4rem;}
    .section{padding:2rem 1.5rem;}
    .section.dark{background:#091424;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.1em;color:#c9a84c;margin-bottom:1rem;text-transform:uppercase;}
    .divider{width:40px;height:2px;background:#c9a84c;margin:0 0 1.5rem;border-radius:1px;}
    .match-card{background:#0d1f3c;border:1px solid rgba(201,168,76,0.2);border-radius:14px;padding:1rem 1.25rem;margin-bottom:0.75rem;display:flex;align-items:center;gap:0.75rem;max-width:700px;}
    .match-card.upcoming{border-left:3px solid #c9a84c;}
    .match-card.past{border-left:3px solid rgba(255,255,255,0.15);opacity:0.75;}
    .match-date{min-width:48px;text-align:center;flex-shrink:0;}
    .match-date .day{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#c9a84c;line-height:1;}
    .match-date .month{font-size:0.65rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;}
    .match-divider{width:1px;height:50px;background:rgba(255,255,255,0.1);flex-shrink:0;}
    .match-info{flex:1;min-width:0;}
    .match-teams{font-size:0.9rem;font-weight:600;color:#fff;margin-bottom:0.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .match-teams .vs{color:rgba(255,255,255,0.35);font-weight:400;margin:0 4px;font-size:0.8rem;}
    .match-meta{font-size:0.7rem;color:rgba(255,255,255,0.45);}
    .match-meta span{margin-right:6px;}
    .match-time{text-align:right;flex-shrink:0;}
    .match-time .time-to{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:#fff;line-height:1;}
    .match-time .time-fr{font-size:0.65rem;color:rgba(255,255,255,0.4);margin-top:2px;}
    .match-score{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#c9a84c;text-align:right;flex-shrink:0;}
    @media(max-width:500px){
      .match-date{min-width:36px;}.match-date .day{font-size:1.1rem;}
      .match-teams{font-size:0.82rem;}.match-time .time-to{font-size:1rem;}
      .match-score{font-size:1.1rem;}.match-divider{display:none;}
      .match-card{padding:0.75rem 0.85rem;gap:0.5rem;}
      .badge-upcoming{display:none;}
    }
    .badge-upcoming{display:inline-block;background:rgba(201,168,76,0.15);color:#c9a84c;font-size:0.65rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;}
    #loading{text-align:center;padding:2rem;color:rgba(255,255,255,0.4);font-size:0.9rem;}
    .footer{background:#060f1c;padding:1.25rem;text-align:center;border-top:1px solid rgba(255,255,255,0.06);}
    .footer p{font-size:0.72rem;color:rgba(255,255,255,0.25);letter-spacing:0.04em;}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="topbar-logo" href="index.html"><img src="logo.png" alt="logo"/><span>OM <em>Toronto</em></span></a>
    <nav>
      <a class="nav-link" href="index.html" data-fr="Accueil" data-en="Home">Accueil</a>
      <a class="nav-link active" href="calendrier.html" data-fr="Agenda" data-en="Agenda">Agenda</a>
      <a class="nav-link" href="galerie.html" data-fr="Galerie" data-en="Gallery">Galerie</a>
      <a class="nav-link" href="medias.html" data-fr="Médias" data-en="Media">Médias</a><a class="nav-link" href="goodies.html" data-fr="Goodies" data-en="Goodies">Goodies</a>
      <div class="lang-bar">
        <button class="lang-btn active" onclick="setLang('fr',event)">🇫🇷</button>
        <button class="lang-btn" onclick="setLang('en',event)">🇬🇧</button>
      </div>
    </nav>
  </div>
  <div class="page-body">
    <div class="page-header">
      <h1 data-fr="Agenda & <span>Événements</span>" data-en="Schedule & <span>Events</span>">Agenda & <span>Événements</span></h1>
      <p data-fr="Matchs, sorties & événements du club" data-en="Matches, outings & club events">Matchs, sorties & événements du club</p>
    </div>
    <div class="section dark">
      <div class="section-title" data-fr="⚽ Prochains matchs" data-en="⚽ Upcoming matches">⚽ Prochains matchs</div>
      <div class="divider"></div>
      <div id="upcoming"><div id="loading">Chargement…</div></div>
    </div>
    <div class="section" style="background:#0a1628;border-top:1px solid rgba(201,168,76,0.15);">
      <div class="section-title" data-fr="🗓️ Événements à venir" data-en="🗓️ Upcoming events">🗓️ Événements à venir</div>
      <div class="divider"></div>
      <div id="events-upcoming"></div>
    </div>
    <div class="section" style="background:#0d1f3c;border-top:1px solid rgba(201,168,76,0.1);">
      <div class="section-title" data-fr="🏁 Matchs passés" data-en="🏁 Past matches">🏁 Matchs passés</div>
      <div class="divider"></div>
      <div id="past"></div>
    </div>
    <footer class="footer">
      <p>© 2023 OM Toronto Club · <span data-fr="Site officiel" data-en="Official website">Site officiel</span> · Not affiliated with Olympique de Marseille</p>
    </footer>
  </div>
  <script>
    function setLang(lang,event){document.querySelectorAll("[data-fr]").forEach(el=>{if(el.getAttribute("data-"+lang))el.innerHTML=el.getAttribute("data-"+lang)});document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));event.currentTarget.classList.add("active");document.documentElement.lang=lang;localStorage.setItem("lang",lang);renderMatches(lang);renderEvents(lang);}
    const MONTHS_FR=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
    const MONTHS_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    let allMatches=[];
    function parseCSV(text){
      const lines=text.trim().split("\n");
      const headers=lines[0].split(",").map(h=>h.trim());
      return lines.slice(1).map(line=>{
        const vals=line.split(",").map(v=>v.trim());
        const obj={};
        headers.forEach((h,i)=>obj[h]=vals[i]||"");
        return obj;
      });
    }
    function renderMatches(lang){
      const now=new Date();
      const upcoming=allMatches.filter(m=>m.statut==="a_venir").sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,5);
      const past=allMatches.filter(m=>m.statut==="termine").sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
      const months=lang==="en"?MONTHS_EN:MONTHS_FR;
      function card(m,type){
        const d=new Date(m.date+"T12:00:00");
        const day=d.getDate();
        const mon=months[d.getMonth()];
        const dowIdx=d.getDay();
        const DAYS_FR=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
        const DAYS_EN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        const DAYS_FULL_FR=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
        const DAYS_FULL_EN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const isKey=[0,3,6].includes(dowIdx);
        const dayLabel=isKey?(lang==="en"?DAYS_FULL_EN[dowIdx]:DAYS_FULL_FR[dowIdx]):(lang==="en"?DAYS_EN[dowIdx]:DAYS_FR[dowIdx]);
        const teams=`<span class="match-teams">${m.domicile}<span class="vs">vs</span>${m.exterieur}${type==="upcoming"?'<span class="badge-upcoming">'+(lang==="en"?"upcoming":"à venir")+"</span>":""}</span>`;
        const meta=`<div class="match-meta"><span>📅 ${dayLabel} ${day} ${mon} ${d.getFullYear()}</span><span>🏆 ${m.competition}</span></div>`;
        const timeOrScore=type==="upcoming"
          ?`<div class="match-time"><div class="time-to">🇨🇦 ${m.heure_toronto} ET</div><div class="time-fr">🇫🇷 ${m.heure_fr}</div></div>`
          :`<div class="match-score">${m.score||"–"}</div>`;
        return `<div class="match-card ${type}"><div class="match-date"><div class="day">${day}</div><div class="month">${mon}</div></div><div class="match-divider"></div><div class="match-info">${teams}${meta}</div>${timeOrScore}</div>`;
      }
      document.getElementById("upcoming").innerHTML=upcoming.length?upcoming.map(m=>card(m,"upcoming")).join(""):`<p style="color:rgba(255,255,255,0.35);font-size:0.9rem;">${lang==="en"?"No upcoming matches scheduled.":"Aucun match à venir pour le moment."}</p>`;
      document.getElementById("past").innerHTML=past.length?past.map(m=>card(m,"past")).join(""):`<p style="color:rgba(255,255,255,0.35);font-size:0.9rem;">${lang==="en"?"No past matches yet.":"Aucun match passé pour le moment."}</p>`;
    }
    const EVENTS = [
      // UPCOMING EVENTS — add yours here
      // { date:"2026-06-01", titre:"Concours de pétanque", titre_en:"Pétanque tournament", desc:"Rejoignez-nous !", desc_en:"Join us!", lieu:"PJ O'Brien", lien:"" },
    ];
    const PAST_EVENTS = [
      {
        date:"2026-02-12",
        titre:"Soccer Networking Event",
        titre_en:"Soccer Networking Event",
        desc:"Une soirée unique réunissant les passionnés de foot à Toronto — networking, rencontres et culture football. Nous y avons promu l'OM Toronto Club !",
        desc_en:"A unique evening bringing together soccer enthusiasts in Toronto — networking, connections and football culture. We promoted the OM Toronto Club!",
        lieu:"Pizza Rustica, 7 Blue Jays Way",
        lien:"https://www.eventbrite.ca/e/soccer-networking-event-tickets-1980665212970/"
      },
      {
        date:"2025-12-04",
        titre:"Soccer Networking Event",
        titre_en:"Soccer Networking Event",
        desc:"2ème édition du Soccer Networking Event à Toronto. Soirée networking foot dans une ambiance internationale.",
        desc_en:"2nd edition of the Soccer Networking Event in Toronto. Football networking evening in an international atmosphere.",
        lieu:"St Louis Atrium, 595 Bay St",
        lien:"https://www.eventbrite.ca/e/soccer-networking-event-tickets-1968820940432"
      },
      {
        date:"2025-09-18",
        titre:"Soccer Networking Event",
        titre_en:"Soccer Networking Event",
        desc:"1ère participation au Soccer Networking Event de Toronto — première sortie officielle du club dans la communauté foot de la ville.",
        desc_en:"First participation in Toronto's Soccer Networking Event — the club's first official outing in the city's football community.",
        lieu:"The Pint, Toronto",
        lien:"https://www.eventbrite.ca/e/soccer-networking-event-tickets-1644025828509"
      }
    ];
    function renderEvents(lang){
      const MONTHS_E=lang==="en"?MONTHS_EN:MONTHS_FR;
      function evCard(e, past){
        const d=new Date(e.date+"T12:00:00");
        const day=d.getDate(); const mon=MONTHS_E[d.getMonth()];
        const titre=lang==="en"&&e.titre_en?e.titre_en:e.titre;
        const desc=lang==="en"&&e.desc_en?e.desc_en:e.desc;
        const linkHtml=e.lien?`<a class="event-card-link" href="${e.lien}" target="_blank" rel="noopener">🔗 ${lang==="en"?"More info":"Plus d'infos"}</a>`:"";
        const tag=past?`<span class="event-tag past-tag">${lang==="en"?"Past":"Passé"}</span>`:`<span class="event-tag">${lang==="en"?"Upcoming":"À venir"}</span>`;
        return `<div class="event-card-new${past?" past":""}"><div class="event-card-img">🗓️</div><div class="event-card-body">${tag}<div class="event-card-title">${titre}</div>${desc?`<div class="event-card-desc">${desc}</div>`:""}<div class="event-card-lieu">${e.lieu?`📍 ${e.lieu}`:""}</div><div class="event-card-date">📅 ${day} ${mon} ${d.getFullYear()}</div>${linkHtml}</div></div>`;
      }
      // Upcoming events
      const upEl=document.getElementById("events-upcoming");
      if(EVENTS.length){upEl.innerHTML=`<div class="event-grid">${EVENTS.map(e=>evCard(e,false)).join("")}</div>`;}
      else{upEl.innerHTML=`<p style="color:rgba(255,255,255,0.35);font-size:0.9rem;">${lang==="en"?"No upcoming events.":"Aucun événement à venir pour le moment."}</p>`;}
      // Past events after past matches
      const pastMatchEl=document.getElementById("past");
      // Remove any previously rendered past events section
      const old=document.getElementById("past-events-section");
      if(old)old.remove();
      if(PAST_EVENTS.length){
        const sec=document.createElement("div");
        sec.id="past-events-section";
        sec.innerHTML=`<div class="events-subtitle">${lang==="en"?"🗓️ PAST EVENTS":"🗓️ ÉVÉNEMENTS PASSÉS"}</div><div class="event-grid">${PAST_EVENTS.map(e=>evCard(e,true)).join("")}</div>`;
        pastMatchEl.parentNode.appendChild(sec);
      }
    }

    fetch("matchs.csv").then(r=>r.text()).then(text=>{
      allMatches=parseCSV(text);
      const lang=localStorage.getItem("lang")||"fr";
      renderMatches(lang);
      renderEvents(lang);
    }).catch(()=>{document.getElementById("loading").textContent="Impossible de recharger le fichier matchs.csv";});
    (function(){const l=localStorage.getItem("lang")||"fr";if(l!=="fr"){document.querySelectorAll("[data-fr]").forEach(el=>{if(el.getAttribute("data-"+l))el.innerHTML=el.getAttribute("data-"+l)});document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));const btns=document.querySelectorAll(".lang-btn");if(l==="en"&&btns[1])btns[1].classList.add("active");document.documentElement.lang=l;}})();
  </script>
</body>
</html>
